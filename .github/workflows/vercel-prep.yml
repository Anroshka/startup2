name: Prepare Vercel deployment
on:
  push:
    branches: [feature/supabase-auth]
    paths: ['.github/workflows/vercel-prep.yml']
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/supabase-auth
      - name: Replace legacy sign-in link
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('web/app/app/workspace.tsx')
          s=p.read_text()
          s=s.replace('/signin-with-chatgpt?return_to=%2Fonboarding','/login?next=%2Fonboarding')
          p.write_text(s)
          PY
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
      - name: Install
        working-directory: web
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build Next.js
        working-directory: web
        run: pnpm build
      - name: Commit link fix
        run: |
          if git diff --quiet -- web/app/app/workspace.tsx; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/app/app/workspace.tsx
          git commit -m "Replace legacy ChatGPT sign-in link"
          git push
