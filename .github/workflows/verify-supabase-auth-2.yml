name: Verify Supabase auth 2
on:
  push:
    branches: [feature/supabase-auth]
    paths: ['.github/workflows/verify-supabase-auth-2.yml']
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/supabase-auth
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm build
