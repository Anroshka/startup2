name: Update Supabase lockfile
on:
  push:
    branches: [feature/supabase-auth]
permissions:
  contents: write
jobs:
  lockfile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/supabase-auth
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --lockfile-only --ignore-scripts --no-frozen-lockfile
      - name: Commit lockfile
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "Update pnpm lockfile for Supabase"
          git push
